```\r
\r
### Carimbar `review` no `SUMARIO.md` (5.1)\r
\r
Logo depois de escrever o `tasks/{TASK_ID}/REVIEW.md` e **antes** de apresentar o veredito compacto, carimbar a fase com o veredito atual (contrato completo na skill `sdd`, §Fechamento de fase — carimbar o `SUMARIO.md`):\r
\r
| Veredito       | Chamada                                                                                                   |\r
| -------------- | --------------------------------------------------------------------------------------------------------- |\r
| `APROVADO ✅`  | `node .Codex/hooks/sdd-summary.mjs --task {TASK_ID} --phase review --status done --verdict APROVADO`     |\r
| `BLOQUEADO ❌` | `node .Codex/hooks/sdd-summary.mjs --task {TASK_ID} --phase review --status blocked --verdict BLOQUEADO` |\r
\r
Rodar da raiz do worktree da task. `exit ≠ 0` significa que a fase **não** foi carimbada: ler o diagnóstico em `stderr`, resolver a causa e repetir a chamada antes de apresentar o veredito. O hook `PostToolUse` pode ter carimbado ao ver a escrita do `REVIEW.md`, mas ele sai sempre com `0` e nunca avisa quando falha — a chamada acima é a fonte normativa; o hook é só rede de segurança.\r
\r
Depois do veredito: **parar e aguardar.** Não despachar agente de correção, não editar arquivo.\r
\r
---\r
\r
## Fase 5.2 — Correções sob demanda (repete para cada solicitação do usuário)\r
\r
Quando o usuário retornar com um bug encontrado nos testes ou um pedido de correção/refatoração:\r
\r
### 2a — Entender e classificar\r
\r
Confirme o que foi pedido e classifique por domínio:\r
\r
| Domínio              | Template a usar          |\r
| -------------------- | ------------------------ |\r
| Arquivos de frontend | Template frontend (§ 2b) |\r
\r
Se a solicitação for ambígua, pergunte antes de despachar.\r
\r
### 2b — Despachar agente(s) de correção\r
\r
> **MECANISMO — Agent tool com `subagent_type: "general-purpose"`, e de onde se lança:**\r
>\r
> - Despacho padrão: **Agent tool** com `subagent_type: "general-purpose"` e `run_in_background: false` — edita direto no working tree do worktree da task\r
> - **Sessão em background é permitida quando lançada de dentro do worktree da task** (`.Codex/worktrees/{TASK_ID}/`), onde a sessão já está isolada e o move para worktree novo é pulado. **NUNCA** a partir do checkout principal: de lá o Codex cria **worktree e branch novos**, fora da task, e a correção aterrissa onde ninguém procura\r
> - **Duas sessões nunca editam a mesma task ao mesmo tempo** — o paralelismo é entre tasks, não dentro de uma. Regra completa em [`docs/worktree-e-wip.md`](https://github.com/lucastumeleiro/sdd/blob/main/docs/worktree-e-wip.md)\r
> - **NUNCA** use `subagent_type: "frontend-agent"` — agentes de `.Codex/agents/` não são tipos válidos do Agent tool\r
> - Agentes podem rodar em paralelo: correções independentes, em arquivos diferentes, podem ir na mesma mensagem\r
\r
**Template para correção frontend:**\r
\r
```\r
Agent(\r
  description: "Corrigir bug no frontend — {descrição curta}",\r
  subagent_type: "general-purpose",\r
  prompt: "Você foi selecionado para aplicar uma correção no frontend da task {TASK_ID}.\r
\r
CONTEXTO:\r
- TASK: tasks/{TASK_ID}/TASK.md\r
- MEMORY: tasks/{TASK_ID}/MEMORY.md\r
- REVIEW: tasks/{TASK_ID}/REVIEW.md (se a correção vem de um bloqueante, o ID da regra está lá)\r
\r
CORREÇÃO SOLICITADA:\r
{descrição precisa do que o usuário pediu — arquivo, comportamento esperado, o que está errado}\r
\r
INSTRUÇÕES:\r
- Leia os arquivos afetados antes de editar\r
- Corrija apenas o que foi solicitado — não implemente features novas\r
- Invoque as skills relevantes como referência de padrão antes de editar\r
- NUNCA executar o frontend, a menos que o projeto explicitamente autorize\r
- NUNCA usar lint, a menos que o projeto o exija\r
- NUNCA criar arquivos .md"\r
)\r
```\r
\r
### 2c — Registrar, informar e aguardar\r
\r
Apensar a correção na seção `## Correções aplicadas (5.2)` do `REVIEW.md` — ID da regra (se houver), arquivo, o que mudou, como foi verificada (não é o sub-agente de correção que se auto-valida — reler o arquivo editado e/ou rodar checagem de tipos antes de dar como concluído). **Não reescrever** as tabelas/vereditos por-ID da 5.1: o relatório é o retrato da auditoria, o histórico vai no apêndice.\r
\r
**Veredito é campo vivo — sempre recalcular após cada correção:**\r
\r
1. Releia a seção "Bloqueantes" da 5.1 e verifique se a correção recém-aplicada resolveu algum item marcado `Bloqueia: sim`.\r
2. Se **todos** os bloqueantes foram resolvidos: atualizar o campo `**Veredito:**` no topo do `REVIEW.md` para `APROVADO ✅`, com a anotação `_(atualizado após correção 5.2 — veredito original da 5.1: BLOQUEADO ❌)_`. Marcar cada item resolvido na seção "Bloqueantes" como `✅ Resolvido em 5.2` (não apagar a linha). Atualizar a coluna "Bloqueantes" do "Placar" para `0`.\r
3. Se **ainda restam** bloqueantes: manter `BLOQUEADO ❌` no topo, mas marcar os itens já resolvidos como `✅ Resolvido em 5.2` mesmo assim (progresso parcial visível).\r
4. Reapresentar o **veredito compacto em chat** (mesmo formato da 5.1) refletindo o estado atualizado — nunca deixar o usuário com um veredito de chat desatualizado depois de uma correção.\r
5. **Recarimbar o `SUMARIO.md`** com o veredito recalculado, pela mesma tabela de §Carimbar `review` no `SUMARIO.md` (5.1): a transição `BLOQUEADO` → `APROVADO` vira `--phase review --status done --verdict APROVADO`, e o caminho inverso, `--status blocked --verdict BLOQUEADO`. É a única forma de a correção da 5.2 alcançar o sumário — nenhum hook infere reescrita de verdict. O carimbo é idempotente: se o veredito não mudou, repetir não altera um byte. `exit ≠ 0` significa que o carimbo não saiu — resolver e repetir antes de voltar ao estado de espera.\r
\r
Isso vale mesmo que a correção pareça óbvia ou trivial — o cabeçalho do `REVIEW.md` é o que qualquer pessoa lê primeiro; deixá-lo desatualizado depois de uma correção aplicada é pior que não ter corrigido nada, porque mente sobre o estado real.\r
\r
```\r
Agente(s) despachado(s).\r
\r
Pressione ← (seta esquerda) no prompt vazio para voltar ao Agent View\r
e acompanhar o progresso em tempo real.\r
\r
Quando terminar, re-attach aqui com o próximo item ou confirme que está ok.\r
```\r
\r
**Voltar ao estado de espera.** Aguardar próxima solicitação do usuário.\r
\r
---\r
\r
## Regras\r
\r
- **NUNCA** editar código diretamente — o revisor analisa e coordena; quem edita são os agentes especializados. Vale mesmo para correção de uma linha\r
- **NUNCA** despachar agentes de correção sem solicitação explícita do usuário (os sub-agentes da 5.1 são auditoria read-only, não correção)\r
- **NUNCA** marcar regra como `PASS` sem `arquivo:linha`\r
- **NUNCA** omitir um ID esperado do `REVIEW.md` — ausência é auditoria incompleta, não aprovação tácita\r
- **NUNCA** deixar o campo `Veredito` do topo do `REVIEW.md` (nem o veredito compacto em chat) desatualizado depois de uma correção da 5.2 — se a correção resolveu o(s) bloqueante(s), atualizar para `APROVADO ✅` e reapresentar em chat; ausência de atualização é o relatório mentindo sobre o estado real da feature\r
- **NUNCA** encerrar a 5.1, ou uma correção da 5.2, sem carimbar o `SUMARIO.md` com o veredito vivo e `exit 0` — o hook `PostToolUse` é rede de segurança, jamais a fonte normativa\r
- **NUNCA** lançar uma sessão em background a partir do checkout principal — de lá o Codex cria worktree e branch novos, fora da task; de dentro de `.Codex/worktrees/{TASK_ID}/` é permitido\r
- **NUNCA** declarar ferramenta da 5.0 indisponível sem ter tentado e colado o erro\r
- **NUNCA** rodar comando além dos de análise estática configurados para esta fase\r
- **NUNCA** criar arquivos `.md` além do `tasks/{TASK_ID}/REVIEW.md`\r
- **NUNCA** escrever arquivo de apoio fora de `tasks/{TASK_ID}/.review-scratch/` — nunca em `/tmp` do sistema (sai da árvore do projeto, gera prompt de permissão a cada escrita)\r
- **SEMPRE** rodar a 5.1 em sub-agentes independentes (author ≠ verifier); se não for possível, declarar no `REVIEW.md` que a independência foi simulada\r
- Ser específico nos prompts dos sub-agents de correção: arquivo + comportamento esperado + o que está errado\r
- Se a solicitação não envolver código (pergunta, dúvida, explicação), responder diretamente sem despachar agentes"""
