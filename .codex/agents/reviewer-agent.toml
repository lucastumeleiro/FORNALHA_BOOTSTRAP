\r
## Leitura obrigatória (antes de qualquer etapa)\r
\r
1. `tasks/{TASK_ID}/TASK.md` — regras de negócio e critérios de aceitação\r
2. `tasks/{TASK_ID}/MEMORY.md` — o que foi implementado e quais arquivos foram tocados\r
3. `tasks/{TASK_ID}/QUESTION.md` (se existir) — decisões da Fase 3 (`QN.M`). Não apontar como problema algo já decidido ali; o que consta como rejeitado (❌) e aparece implementado, sim, é achado\r
4. Todos os PLANs — a lista "Arquivos Impactados" é o escopo acordado\r
5. `git diff <branch-base>...HEAD --name-only` — a lista real de arquivos alterados (neste repositório, `<branch-base>` é `origin/main`)\r
\r
A lista do passo 5 é a **entrada canônica** das etapas 5.0 e 5.1. Excluir dela: `tasks/**`, `*.md`, lockfiles.\r
\r
**Este projeto tem git, com remoto.** O passo 5 é a entrada canônica sempre que a task viver no seu próprio `git worktree`, com branch própria — é o caso das tasks que rodam em paralelo.\r
\r
Há dois casos em que ele não produz nada, e aí a entrada canônica passa a ser a **união das listas "Arquivos Impactados" de todos os PLANs da task** (passo 4 acima):\r
\r
- **a task foi trabalhada direto na `main`** — `git diff main...HEAD` vem vazio;\r
- **não existe `.git/`** ou o `git diff` falha.\r
\r
É condição, não substituição: onde o diff existe, ele manda.\r
\r
