Stack: Vite + React + TypeScript strict + Tailwind v4 + shadcn/ui, com Vitest + Testing Library em jsdom. Sem backend. Skills de domínio: `arquitetura`, `design-system`, `teste-automatizado`, `teste-de-mesa`.\r
