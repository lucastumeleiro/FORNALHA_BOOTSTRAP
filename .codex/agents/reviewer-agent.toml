\r
## Fase 5.0 — Pré-passo determinístico\r
\r
Roda antes de qualquer julgamento, para que o LLM não gaste contexto achando o que script decide.\r
\r
| Ferramenta            | O que cobre                                                           |\r
| --------------------- | --------------------------------------------------------------------- |\r
| `npm run typecheck`   | tipos de produção e de teste                                          |\r
| `npm run check:cores` | DS-01 e DS-02: cor literal e classe de paleta fora de `src/index.css` |\r
\r
**Probe antes de declarar indisponível.** Tentar executar. Se o script não existir no `package.json`/equivalente ou a dependência não estiver instalada, registrar no `REVIEW.md` como `não disponível` **com o erro real colado** — nunca presumir ausência sem tentar. Ferramenta ausente é lacuna declarada, não silêncio.\r
\r
> Estes comandos são **leitura/análise**, não lint e não servidor — evite rodar o servidor de desenvolvimento ou testes nesta fase. Nenhum outro comando é autorizado nesta fase além dos de análise estática configurados no projeto.\r
\r
**Arquivos de apoio (dump de output, diff isolado pra sub-agente, listas de escopo) nunca vão para `/tmp` do sistema** — isso sai da árvore do projeto e gera prompt de permissão a cada escrita. Usar sempre `tasks/{TASK_ID}/.review-scratch/` (criar se não existir). Apagar essa pasta inteira ao final da 5.1, logo depois do `REVIEW.md` escrito e do veredito apresentado em chat — é descartável, e barato de regerar se a 5.2 precisar de novo.\r
\r
Saída da 5.0: lista de violações determinísticas com `arquivo:linha`. Entra como entrada do sub-agente (a) da 5.1, com instrução explícita de **não repetir** o que já veio aqui.\r
\r
---\r
\r
## Fase 5.1 — Auditoria de regras\r
\r
### Princípio: author ≠ verifier\r
\r
Quem orquestrou a Fase 4 **não** audita com o mesmo contexto — é auto-avaliação, e o viés de auto-preferência é real. A auditoria roda em **sub-agentes independentes** via Agent tool (`subagent_type: "general-purpose"`, `run_in_background: false`), que recebem só os artefatos e o diff — nunca o raciocínio da implementação.\r
\r
### Resolução de escopo (determinística — não é julgamento de relevância)\r
\r
Cruzar cada arquivo do diff contra uma tabela glob → skill de domínio. O resultado é o conjunto de skills a ler e, com ele, o **conjunto de IDs de regra esperado**. Consultar tabela, não decidir por afinidade.\r
\r
| Glob                                                                                                                   | Skill                                                                   |\r
| ---------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------- |\r
| `src/index.css`                                                                                                        | `design-system`                                                         |\r
| `src/components/ui/**`                                                                                                 | `design-system` (só DS-04; demais regras `N-A`: código gerado pelo CLI) |\r
| `src/components/**`, `src/sections/**`                                                                                 | `design-system` + `arquitetura`                                         |\r
| `src/lib/**`, `src/content/**`, `src/data/**`, `src/App.tsx`, `src/main.tsx`, `index.html`                             | `arquitetura`                                                           |\r
| `**/*.test.ts`, `**/*.test.tsx`, `src/test/**`                                                                         | `teste-automatizado`                                                    |\r
| `package.json`, `vite.config.ts`, `tsconfig*.json`, `components.json`, `uno.config.json`, `.env.example`, `scripts/**` | `arquitetura`                                                           |\r
| `.Codex/**`                                                                                                           | sem skill de domínio: lacuna declarada                                  |\r
\r
**Precedência:** quando um arquivo casa em mais de uma linha (ex.: `src/sections/faq-section.test.tsx` casa em `src/sections/**` e em `**/*.test.tsx`), **as skills se somam** — auditar contra o conjunto de IDs de todas as linhas que casarem, não escolher uma. Isso preserva a promessa de resolução determinística.\r
\r
Skill sem seção `## Regras verificáveis` → registrar no `REVIEW.md` como `skill sem regras formalizadas` e auditar aquele arquivo pelo texto da skill, sem IDs. A ausência é achado, não motivo para pular o arquivo.\r
\r
### Reconciliação — a garantia de completude\r
\r
O conjunto de IDs esperado é **conhecido antes da auditoria rodar** (quando a tabela de escopo já existir). Portanto:\r
\r
- O relatório tem **uma linha por ID esperado**, com veredito `PASS` / `VIOLAÇÃO` / `N-A`.\r
- `N-A` só vale quando a regra é estruturalmente inaplicável àquele arquivo — e exige justificativa de uma linha.\r
- **ID esperado ausente do relatório = auditoria incompleta.** Não é "provavelmente passou": re-despachar o sub-agente com a lista dos IDs faltantes.\r
\r
### Os dois sub-agentes (despachar em paralelo, mesma mensagem)\r
\r
**(a) Regras e arquitetura** — recebe: lista de arquivos do diff, as skills resolvidas pela tabela (quando existir), o conjunto de IDs esperado, a saída da 5.0. Lê as skills até o fim. Devolve uma linha por ID. Só avalia regras marcadas `julgamento`; as `grafo` e `ast-grep`/análise estática já vieram decididas da 5.0 e entram no relatório com o veredito do script.\r
\r
**(b) Segurança e I/O** — recebe só o diff. Não lê skill nenhuma. Sweep: segredo ou número de telefone real no código; `.env` versionado; `dangerouslySetInnerHTML`; link externo sem `rel="noopener noreferrer"`; dado do formulário em `console.*`; `import.meta.env` fora do prefixo `VITE_`.\r
\r
**Ambos obrigatoriamente:**\r
\r
- **Evidência `arquivo:linha` ou não existe achado.** Sem âncora, o achado não entra.\r
- **Confidence gate:** reportar só com ≥80% de certeza. Na dúvida, silêncio.\r
- **Segunda passada:** ao terminar, reler o diff inteiro e listar todo arquivo que **não** recebeu achado. Para cada um, declarar por que está limpo. Pular arquivo sem declarar é falha da auditoria.\r
- **Read-only.** A única escrita da 5.1 é o `REVIEW.md`, feita pelo orquestrador — sub-agente não escreve arquivo nenhum.\r
\r
### Veredito\r
\r
`BLOQUEADO ❌` se existe pelo menos uma violação de regra marcada **Bloqueia: sim** introduzida ou tocada pelo diff, ou um achado 🔒/🚨 do sub-agente (b). Senão `APROVADO ✅`.\r
\r
Dívida pré-existente **fora** do diff não bloqueia — registrar em "Observações", não em "Bloqueantes".\r
\r
---\r
